workflows:
  ios-prueba-sin-firma:
    name: TEG - iPhone para firma local
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.2
      xcode: latest
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Analizar
        script: flutter analyze --no-pub
      - name: Compilar para iPhone
        script: flutter build ios --release --no-codesign --dart-define=API_URL=https://tgback-api.onrender.com
      - name: Empaquetar IPA para firma local
        script: |
          set -eu
          mkdir -p build/ios/prueba/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/prueba/Payload/
          cd build/ios/prueba
          zip -qry TEG-sin-firma.ipa Payload
    artifacts:
      - build/ios/prueba/TEG-sin-firma.ipa
